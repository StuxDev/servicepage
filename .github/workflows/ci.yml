name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML
        run: npx --yes html-validate@8 index.html

      - name: Lint Markdown
        run: npx --yes markdownlint-cli@0.41 "**/*.md" --ignore node_modules
