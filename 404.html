<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://global.media.stux.dev/icon.png">
    <meta name="description" content="Page not found — Stux.Dev">
    <title>Page Not Found — Stux.Dev</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --font-sans: 'Gontserrat', system-ui, -apple-system, sans-serif;
            --font-display: 'Creato Display', 'Gontserrat', system-ui, -apple-system, sans-serif;
            --orange: #FD6602;
        }
        [data-theme="dark"] {
            --bg: #120D08; --text: #F2E9E2; --text-muted: #94806A; --badge-bg: rgba(253,102,2,0.12); --border-mid: rgba(253,102,2,0.18);
        }
        [data-theme="light"] {
            --bg: #FBF6F4; --text: #2A1A0F; --text-muted: #6B4A3A; --badge-bg: rgba(253,102,2,0.10); --border-mid: rgba(253,102,2,0.25);
        }

        html, body {
            background: var(--bg); color: var(--text); font-family: var(--font-sans);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; transition: background 0.3s, color 0.3s;
        }

        a, a:visited { color: var(--orange); text-decoration: none; }
        a:hover, a:focus { opacity: 0.8; }

        .wrapper { padding: 2rem 1.5rem; max-width: 420px; }
        .code { font-family: var(--font-display); font-weight: 800; font-size: clamp(3.5rem, 12vw, 5.5rem); line-height: 1; color: var(--orange); margin-bottom: 0.5rem; }
        h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 4vw, 1.7rem); margin-bottom: 0.75rem; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 1.75rem; }

        .home-link {
            display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 12px;
            font-size: 14px; font-weight: 500; border: 1px solid var(--border-mid); background: var(--badge-bg); transition: opacity 0.2s;
        }
        .home-link:hover { opacity: 0.85; }

        #theme-toggle {
            position: fixed; top: 14px; right: 14px; z-index: 100; background: var(--badge-bg); border: 1px solid var(--border-mid);
            border-radius: 50%; width: 38px; height: 38px; font-size: 15px; text-align: center; cursor: pointer;
            padding: 0; color: var(--orange); display: flex; align-items: center; justify-content: center;
        }
        #theme-toggle:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <button id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">&#9788;</button>

    <div class="wrapper">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>Whatever you were looking for isn't here &mdash; the link might be old, or the page might have moved.</p>
        <a class="home-link" href="./">&larr; Back to Stux.Dev</a>
    </div>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('theme-toggle');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var stored = localStorage.getItem('stuxdev-theme');
            var isDark = stored ? stored === 'dark' : prefersDark;

            function apply(dark) {
                root.setAttribute('data-theme', dark ? 'dark' : 'light');
                btn.textContent = dark ? '☀' : '☾';
                btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
            }

            apply(isDark);

            btn.addEventListener('click', function () {
                isDark = !isDark;
                localStorage.setItem('stuxdev-theme', isDark ? 'dark' : 'light');
                apply(isDark);
            });
        })();
    </script>
</body>
</html>
